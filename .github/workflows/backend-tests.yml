name: backend-tests

on:
  push:
    branches: [main, "fix/**", "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The Groq client is constructed at import time and needs a key present.
      # It is never used to make a real call — every test mocks it.
      GROQ_API_KEY: test-key-not-used
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # NOTE: this installs the full backend stack (torch via openai-whisper,
      # chromadb, sentence-transformers), which is slow. Removing the unused
      # `openai-whisper` and `reportlab`-in-prod dependencies (tracked in
      # DESIGN_DECISIONS.md / LESSONS_LEARNED.md) will materially cut CI time.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
